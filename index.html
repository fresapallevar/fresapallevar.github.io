
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F20B70">
  <meta name="description" content="Fresa Pa’Llevar. Fresas con crema para disfrutar. ¡Pide a domicilio!">
  <title>Fresa Pa’Llevar 🍓</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F20B70;
      color: white;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px 22px;
    }

    main {
      width: 100%;
      max-width: 390px;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 310px;
      max-height: 310px;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    h1 {
      font-family: 'Anton', sans-serif;
      font-size: clamp(29px, 8vw, 43px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 1px;
      margin: 0 0 13px;
    }

    .subtitulo {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 35px;
    }

    .boton {
      display: block;
      width: 100%;
      background: white;
      color: #F20B70;
      text-decoration: none;
      font-family: 'Anton', sans-serif;
      font-size: 23px;
      letter-spacing: 0.6px;
      padding: 17px 14px;
      border-radius: 15px;
      margin: 15px 0;
      transition: transform 0.2s;
    }

    .boton:active {
      transform: scale(0.97);
    }

    .boton:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    footer {
      margin-top: 35px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="LOGO%20ROSA%20FRESA%20%281%29.png"
      alt="Logotipo de Fresa Pa’Llevar"
    >

    <h1>¡LA FELICIDAD SE PIDE A DOMICILIO!</h1>

    <p class="subtitulo">
      Fresas con crema que alegran tu día 🍓
    </p>

    <a
      class="boton"
      href="https://wa.me/525631272154?text=Hola%2C%20quiero%20hacer%20un%20pedido%20de%20Fresa%20Pa%27Llevar%20%F0%9F%8D%93"
      target="_blank"
      rel="noopener noreferrer"
    >
      🍓 PEDIR POR WHATSAPP
    </a>

    <a
      class="boton"
      href="https://www.instagram.com/fresapallevar/"
      target="_blank"
      rel="noopener noreferrer"
    >
      ♡ SÍGUENOS EN INSTAGRAM
    </a>

    <footer>
      FRESA PA’LLEVAR © 2026
    </footer>
  </main>
</body>
</html>
